<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essay | Chinmaya Patro's Policy Corner</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="article-masthead">
      <a href="index.html" class="article-brand">CP <span>Chinmaya Patro's Policy Corner</span></a>
      <a href="index.html" class="back-link">← Essays</a>
    </header>

    <main class="article-page">
      <div class="meta-header" id="article-meta"></div>
      <h1 id="article-title"></h1>
      <div class="article-rule"></div>
      <img id="article-hero-image" class="article-hero-image" alt="" hidden>
      <div class="article-body" id="article-content"></div>
    </main>

    <footer class="site-footer">
      <strong>Chinmaya Patro's Policy Corner</strong>
      <a href="index.html">Return to the reading room →</a>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id');
    const post = articles.find(a => a.id === articleId);

    if (post) {
      document.title = `${post.title} | Chinmaya Patro's Policy Corner`;
      document.getElementById('article-meta').innerHTML = `
        <span class="meta-topic">${post.topicLabel}</span>
        <span>•</span>
        <span>${post.date}</span>
        <span>•</span>
        <span>${post.readingTime}</span>
      `;
      document.getElementById('article-title').textContent = post.title;

      if (post.image) {
        const heroImg = document.getElementById('article-hero-image');
        heroImg.src = post.image;
        heroImg.alt = post.imageAlt || '';
        heroImg.hidden = false;
      }

      document.getElementById('article-content').innerHTML = post.content;
    } else {
      document.getElementById('article-title').textContent = "Essay Not Found";
      document.getElementById('article-content').innerHTML = "<p>The requested essay could not be located.</p>";
    }
  </script>
</body>
</html>
